name: macOS and Linux probe
# Temporary 0.14.0 discovery run (.local plan, phase 1): shows what already works
# on macOS and Ubuntu before any platform code changes. Steps keep going after a
# failure so one run reports everything. Replaced by real CI groups in phase 4.
on:
  push:
    branches: [cross-platform]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-platform-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: Probe ${{ matrix.os }} ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Electron suites run in parallel groups so a run takes ~4 minutes, not ~9.
      # Static checks and unit tests run once per OS, in the 'core' group.
      matrix:
        os: [macos-latest, ubuntu-latest]
        group: [core, data, ui]
        include:
          - group: core
            suites: test:e2e test:network test:monitoring test:watch
          - group: data
            suites: test:telemetry test:kaf test:data
          - group: ui
            suites: test:ui test:ai test:search test:project-facts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - if: runner.os == 'Linux'
        name: Prepare a headless display, Electron's sandbox and a keyring on the runner
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, which
        # Electron's sandbox needs. This only relaxes the disposable CI runner.
        # Chromium refuses its basic_text password store, so key-saving suites need
        # a real secret service on the session bus.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring dbus-x11
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          # No desktop session on the runner, so tell Chromium which password store to pick.
          echo "XDG_CURRENT_DESKTOP=GNOME" >> "$GITHUB_ENV"
          echo -n 'rased-ci' | gnome-keyring-daemon --unlock --components=secrets | tee -a "$GITHUB_ENV"
      - id: install
        continue-on-error: true
        run: npm ci && node scripts/ensure-electron.mjs
      - id: typecheck
        if: matrix.group == 'core'
        continue-on-error: true
        run: npm run typecheck
      - id: lint
        if: matrix.group == 'core'
        continue-on-error: true
        run: npm run lint
      # Logs need a GitHub sign-in, so every failure is also re-emitted as a
      # public annotation (tail of its output) by the Summary step.
      - id: unit
        if: matrix.group == 'core'
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npx vitest run --reporter=default --reporter=json --outputFile=probe-unit.json 2>&1 | tee probe-unit.log
      - id: build
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee probe-build.log
      - id: suites
        name: Electron suites (Windows-only suites skipped)
        continue-on-error: true
        shell: bash
        # Skipped as Windows-only by design: test:startup (WAL file mapping),
        # test:notification-activation (COM toasts), test:quick-apply,
        # test:extension (Quick Apply deferred) and test:update-install (NSIS).
        env:
          PROBE_GROUP_SUITES: ${{ matrix.suites }}
        run: |
          # Suites resolve the platform Electron binary themselves (scripts/cdp-tools.mjs electronPath);
          # passing --exe would make some suites treat it as a packaged app and skip out/main/index.js.
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          mkdir -p probe-logs
          failed=()
          for suite in $PROBE_GROUP_SUITES; do
            echo "::group::$suite"
            if (set -o pipefail; run npm run "$suite" 2>&1 | tee "probe-logs/${suite#test:}.log"); then echo "::endgroup::"; echo "PASS $suite" >> probe-suites.txt
            else echo "::endgroup::"; echo "FAIL $suite" >> probe-suites.txt; failed+=("$suite"); fi
          done
          if [ ${#failed[@]} -gt 0 ]; then exit 1; fi
      - name: Summary
        if: always()
        run: node scripts/ci-probe-summary.mjs
        env:
          PROBE_OS: ${{ matrix.os }} ${{ matrix.group }}
          PROBE_INSTALL: ${{ steps.install.outcome }}
          PROBE_TYPECHECK: ${{ steps.typecheck.outcome }}
          PROBE_LINT: ${{ steps.lint.outcome }}
          PROBE_UNIT: ${{ steps.unit.outcome }}
          PROBE_BUILD: ${{ steps.build.outcome }}
          PROBE_SUITES: ${{ steps.suites.outcome }}
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - if: runner.os == 'Linux'
        name: Prepare a headless display, Electron's sandbox and a keyring on the runner
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, which
        # Electron's sandbox needs. This only relaxes the disposable CI runner.
        # Chromium refuses its basic_text password store, so key-saving suites need
        # a real secret service on the session bus.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring dbus-x11
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          # No desktop session on the runner, so tell Chromium which password store to pick.
          echo "XDG_CURRENT_DESKTOP=GNOME" >> "$GITHUB_ENV"
          echo -n 'rased-ci' | gnome-keyring-daemon --unlock --components=secrets | tee -a "$GITHUB_ENV"
      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          (npm ci && node scripts/ensure-electron.mjs) 2>&1 | tee probe-package-install.log
      - name: Build package
        id: build
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = macOS ]; then CMD="npm run dist:mac"; else CMD="npm run dist:linux"; fi
          $CMD 2>&1 | tee probe-package-build.log
      - name: Verify release files
        id: verify
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = macOS ]; then P=mac; else P=linux; fi
          node scripts/verify-release-files.mjs --platform=$P 2>&1 | tee probe-package-verify.log
      - name: Smoke-test packaged app
        id: smoke
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            node scripts/e2e-cdp.mjs --exe=release/mac-universal/RASED.app/Contents/MacOS/RASED --app= 2>&1 | tee probe-package-smoke.log
          else
            xvfb-run -a node scripts/e2e-cdp.mjs --exe=release/linux-unpacked/rased --app= 2>&1 | tee probe-package-smoke.log
          fi
      - name: Report failures
        if: always()
        shell: bash
        run: |
          failed=0
          for step in install build verify smoke; do
            outcome="${{ steps.install.outcome }}"
            case "$step" in
              install) outcome="${{ steps.install.outcome }}" ;;
              build) outcome="${{ steps.build.outcome }}" ;;
              verify) outcome="${{ steps.verify.outcome }}" ;;
              smoke) outcome="${{ steps.smoke.outcome }}" ;;
            esac
            if [ "$outcome" = failure ]; then
              failed=1
              tail=$(tail -n 30 "probe-package-$step.log" 2>/dev/null | sed 's/%/%25/g; s/\r//g; s/\n/%0A/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
              echo "::error title=${{ matrix.os }} package $step::${tail:-no output}"
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
      - name: Upload package artifact
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rased-package-probe-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            release/RASED-*-mac.dmg
            release/RASED-*-linux-x86_64.AppImage
            release/RASED-*-linux-amd64.deb
