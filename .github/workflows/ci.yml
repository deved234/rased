name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-electron.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:search
      - run: npm run test:notification-activation
      - run: npm run test:telemetry
      - run: npm run test:startup
      - run: npm run test:ai
      - run: npm run test:quick-apply
      - run: npm run test:ui
      - run: npm run test:kaf
      - run: npm run test:data
      - run: npm run test:monitoring
      - run: npm run test:project-facts
      - run: npx playwright-core install chromium
      - run: npm run test:extension
